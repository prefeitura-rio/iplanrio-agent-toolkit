[project]
name = "iplanrio-agent-toolkit"
version = "0.1.0"
description = "Infraestrutura genérica reutilizável para chamar agentes de IA (LLMs de visão/extração): clientes Gemini, cache, rate limiting, rule engine, GCS e versionamento de prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-auth>=2.0.0",
    "google-cloud-storage>=2.0.0",
    "google-cloud-bigquery>=3.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
# google-generativeai pins protobuf<6, which conflicts with consumers that pin
# protobuf>=6.x transitively. Kept as an extra so this package stays resolvable
# as a dependency even when the consumer can't install google-generativeai in
# the same environment (see prefeitura-rio/prefect_rj_iplanrio TROUBLESHOOTING).
gemini = ["google-generativeai>=0.4.0"]
pdf = ["PyMuPDF>=1.23.0", "pypdf>=6.14.2"]
ocr = ["pdf2image>=1.16.0", "pillow>=10.0.0", "PyMuPDF>=1.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iplanrio_agent_toolkit"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.lint]
fixable = ["ALL"]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "PT",
  "PTH",
  "RUF",
  "W",
]

[tool.ruff.lint.per-file-ignores]
# Test files deliberately use magic values in assertions, naive datetimes,
# and lazy imports for optional deps (e.g. `importorskip("fitz")`).
"tests/**" = [
  "ARG001",
  "ARG002",
  "ARG004",
  "DTZ001",
  "PLC0415",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "RUF059",
  "RUF100",
]

[tool.ruff.format]
quote-style = "double"
